name: KAP Bot

on:
  schedule:
    - cron: '0 15 * * *' 
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Gerekli Kütüphaneleri Yükle (Sanal Ekran Dahil)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install undetected-chromedriver selenium google-genai gspread
          
      - name: Botu Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        # Botu xvfb sanal ekranı içinde çalıştırıyoruz
        run: xvfb-run python kap_bot.py
